version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: internshala-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - internshala-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: internshala-backend
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/internshala
      SECRET_TOKEN: your_secret_key_here_change_in_production
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - internshala-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: internshala-frontend
    ports:
      - "80:80"
    environment:
      REACT_APP_API_URL: http://localhost:3000/api/v1
    depends_on:
      - backend
    networks:
      - internshala-network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  internshala-network:
    driver: bridge
